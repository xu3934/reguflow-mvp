services:
  - type: web
    name: reguflow-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_FAST_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-large
